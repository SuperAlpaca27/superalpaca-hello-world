name: superalpaca-bee
description: |
  Bzzzzzzzzzzzzzzzzzzzzzzzzzz
version: "not-an-int"
summary: Bzzzzzzzzzzzzzzzzzzzzzzzz
base: ubuntu@24.04
platforms:
  amd64:
  s390x:

parts:
  thing:
    plugin: nil
    source: .
    override-build: |
      set -eu

      # Manually do what `build-snaps: [hello-world/latest/stable]` would do,
      # mimicking the requests snapd 2.76 itself makes (see snapd's
      # store/store_action.go and store/store.go):
      #   1. POST /v2/snaps/refresh with an install action for the snap
      #   2. download the snap file from the URL the store returns
      #   3. verify the download's sha3-384 like snapd does
      arch="$(dpkg --print-architecture)"
      kernel="$(uname -r)"
      mkdir -p "$CRAFT_PART_INSTALL"

      request='{
        "context": [],
        "actions": [
          {
            "action": "install",
            "instance-key": "install-1",
            "name": "hello-world",
            "channel": "latest/stable",
            "epoch": null
          }
        ],
        "fields": [
          "architectures", "base", "confinement", "links", "contact",
          "created-at", "description", "download", "epoch", "license",
          "name", "prices", "private", "publisher", "revision", "snap-id",
          "snap-yaml", "summary", "title", "type", "version", "website",
          "store-url", "integrity", "media", "common-ids", "categories"
        ]
      }'

      echo "asking the staging snap store for hello-world/latest/stable ($arch)"
      response="$(curl -sS --fail -X POST "https://api.staging.snapcraft.io/v2/snaps/refresh" \
        -H "Content-Type: application/json" \
        -H "Accept: application/json" \
        -H "Snap-Device-Architecture: $arch" \
        -H "Snap-Device-Series: 16" \
        -H "Snap-Classic: true" \
        -H "Snap-Device-Capabilities: default-tracks" \
        -H "Snap-Accept-Delta-Format: xdelta3" \
        -H "User-Agent: snapd/2.76 (series 16; classic) ubuntu/24.04 ($arch) linux/$kernel" \
        --data-binary "$request")"

      eval "$(printf '%s' "$response" | python3 -c '
      import json, shlex, sys
      res = json.load(sys.stdin)["results"][0]
      if res["result"] == "error":
          err = res["error"]
          sys.exit("store error: " + err["code"] + ": " + err["message"])
      snap = res["snap"]
      dl = snap["download"]
      print("url=" + shlex.quote(dl["url"]))
      print("sha3_384=" + shlex.quote(dl["sha3-384"]))
      print("revision=" + str(snap["revision"]))
      print("version=" + shlex.quote(snap["version"]))
      print("size=" + str(dl["size"]))
      ')"

      echo "store offered hello-world $version (rev $revision, $size bytes)"
      snap_file="$CRAFT_PART_INSTALL/hello-world_${revision}.snap"
      curl -sSL --fail -o "$snap_file" "$url"

      actual="$(python3 -c 'import hashlib, sys
      print(hashlib.sha3_384(open(sys.argv[1], "rb").read()).hexdigest())' "$snap_file")"
      if [ "$actual" != "$sha3_384" ]; then
          echo "sha3-384 mismatch for $snap_file: expected $sha3_384, got $actual" >&2
          exit 1
      fi
      echo "downloaded and verified $snap_file"

      craftctl default
